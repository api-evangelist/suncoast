actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No public first-party API surface exists to harvest. No first-party
    developer portal, no downloadable OpenAPI/Swagger, no documented FDX or
    Section 1033 data-access API. The record is identity-only, reflecting an
    honest "no public API, aggregator-only" posture for a credit union whose
    open-finance access is mediated entirely by aggregators and its
    digital-banking core provider.
